services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Moscow
    volumes:
      - ./config:/config
      - ./cache:/cache
      - /home/aloncie-server/media:/media
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "992" # GID группы render
    ports:
      - 8096:8096
    restart: unless-stopped

